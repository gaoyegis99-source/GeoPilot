  <text x="900" y="94" text-anchor="middle" class="note">Operator-first · Workflow-driven · Code-capable · Spatially-verified</text>

  <rect x="50" y="125" width="1700" height="150" rx="22" fill="#e9f3fb" stroke="#a8c9e5" stroke-width="2"/>
