<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180">
  <defs>
    <style>
      .title { font-family: 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; font-size: 38px; font-weight: 700; fill: #17324d; }
      .layer { font-family: 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; font-size: 24px; font-weight: 700; fill: #17324d; }
      .box-title { font-family: 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; font-size: 22px; font-weight: 700; fill: #17324d; }
      .box-title-sm { font-family: 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; font-size: 18px; font-weight: 700; fill: #17324d; }
      .box-text { font-family: 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; font-size: 17px; fill: #35516b; }
      .note { font-family: 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; font-size: 17px; fill: #526a7f; }
      .arrow { stroke: #477aa8; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .feedback { stroke: #d17c2f; stroke-width: 3; stroke-dasharray: 10 8; fill: none; marker-end: url(#arrowheadOrange); }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#477aa8"/>
    </marker>
    <marker id="arrowheadOrange" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#d17c2f"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#17324d" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1800" height="1180" fill="#f7fafc"/>
