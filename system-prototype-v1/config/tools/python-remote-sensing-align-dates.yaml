id: python-remote-sensing-align-dates
version: 1
runner: python
implementation: geopilot.remote_sensing_workflow
inputs:
  first_ndvi: raster_ndvi
  second_ndvi: raster_ndvi
  analysis_extent: vector_polygon
outputs:
  aligned_ndvi: raster_ndvi_pair
  alignment_report: json
parameters:
  resampling: {type: enum, values: [nearest, bilinear]}
measurement_policy:
  distance: not_applicable
  area: not_applicable
preconditions: [crs_is_known, geometry_is_valid]
check_rules: [output_exists]
