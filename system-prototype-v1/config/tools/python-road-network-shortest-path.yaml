id: python-road-network-shortest-path
version: 1
runner: python
implementation: geopilot.road_network_shortest_path
inputs:
  network: vector_line
  start: vector_point
  end: vector_point
outputs:
  route_edges: vector_line
  route_summary: json
parameters:
  target_crs: {type: string}
  snap_tolerance_m: {type: number, minimum: 0, unit: meter}
measurement_policy:
  distance: local_projected
  area: not_applicable
preconditions:
  - crs_is_known
  - input_crs_match
  - geometry_is_valid
check_rules:
  - output_exists
  - output_crs_expected
