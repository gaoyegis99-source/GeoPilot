id: python-remote-sensing-scale-reflectance
version: 1
runner: python
implementation: geopilot.remote_sensing_workflow
inputs:
  first_product: raster_product
  second_product: raster_product
  sensor_configuration: json
  band_mapping: json
outputs:
  first_reflectance: raster_reflectance
  second_reflectance: raster_reflectance
  calibration_report: json
parameters: {}
measurement_policy:
  distance: not_applicable
  area: not_applicable
preconditions: [crs_is_known]
check_rules: [output_exists]
