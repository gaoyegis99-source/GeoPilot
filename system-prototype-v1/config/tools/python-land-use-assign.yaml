id: python-land-use-assign
version: 1
runner: python
implementation: geopilot.land_use_transition
inputs:
  overlay_polygons: vector_polygon
  first_classes: vector_polygon
  second_classes: vector_polygon
  zones: vector_polygon
outputs:
  allocations: json
parameters:
  area_crs: {type: string}
  area_unit: {type: enum, values: [square_meter]}
  area_tolerance: {type: number, minimum: 0, unit: square_meter}
  boundary_assignment: {type: enum, values: [split_by_area, centroid, largest_overlap]}
  boundary_tie: {type: enum, values: [unassigned]}
measurement_policy:
  distance: not_applicable
  area: not_applicable
preconditions: [crs_is_known, geometry_is_valid, source_feature_id_is_unique]
check_rules: [output_exists]
