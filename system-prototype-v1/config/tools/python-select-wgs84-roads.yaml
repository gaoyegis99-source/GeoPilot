id: python-select-wgs84-roads
version: 1
runner: python
implementation: geopilot.select_wgs84_roads
inputs:
  source: vector_line
  area: vector_polygon
outputs:
  roads: vector_line
parameters:
  predicate: {type: enum, values: [intersects]}
measurement_policy:
  distance: not_applicable
  area: not_applicable
preconditions: [crs_is_known, geometry_is_valid]
check_rules: [output_exists, output_crs_expected]
