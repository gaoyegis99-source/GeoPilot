id: qgis-extract-by-attribute
version: 1
runner: qgis
implementation: native:extractbyattribute
inputs:
  source: vector_point
outputs:
  filtered: vector_point
parameters:
  field: {type: string}
  operator: {type: enum, values: [equals]}
  value: {type: string}
measurement_policy:
  distance: not_applicable
  area: not_applicable
preconditions:
  - selected_field_exists
check_rules:
  - output_exists
