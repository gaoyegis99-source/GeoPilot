id: polygon-zone-statistics
version: 1
locked_order: true
inputs:
  targets: vector_polygon
  relation_area: vector_polygon
  analysis_extent: vector_polygon
  zones: vector_polygon
input_context:
  targets:
    scopes: [{reference_role: relation_area, allow_empty: true}, {reference_role: analysis_extent, allow_empty: true}]
  zones:
    scopes: [{reference_role: analysis_extent, allow_empty: true}]
critical_options:
  spatial_relation: [intersects, within]
  boundary_assignment: [split_by_area, centroid, largest_overlap]
  boundary_tie: [unassigned]
  area_crs: {type: reference}
preconditions:
  - required_input_roles_available
steps:
  - key: apply_spatial_relation
    tool: {id: python-select-spatial-relation, version: 1}
    inputs:
      targets: {asset: targets}
      area: {asset: relation_area}
    parameters:
      spatial_relation: {option: spatial_relation}
    outputs:
      targets: vector
  - key: clip_back_to_analysis_extent
    tool: {id: python-clip-vector-to-extent, version: 1}
    inputs:
      targets: {step: apply_spatial_relation, output: targets}
      area: {asset: analysis_extent}
    outputs:
      targets: vector
      original_targets: vector
  - key: aggregate_by_zone
    tool: {id: python-polygon-zone-statistics, version: 1}
    inputs:
      targets: {step: clip_back_to_analysis_extent, output: targets}
      original_targets: {step: clip_back_to_analysis_extent, output: original_targets}
      zones: {asset: zones}
    parameters:
      boundary_assignment: {option: boundary_assignment}
      boundary_tie: {option: boundary_tie}
      area_crs: {option: area_crs}
      area_unit: {literal: square_meter}
    outputs:
      allocation_details: table_csv
      zone_statistics: json
expected_artifacts:
  - {role: clipped_targets, step: clip_back_to_analysis_extent, output: targets, type: vector}
  - {role: original_targets, step: clip_back_to_analysis_extent, output: original_targets, type: vector}
  - {role: allocation_details, step: aggregate_by_zone, output: allocation_details, type: table_csv}
  - {role: zone_statistics, step: aggregate_by_zone, output: zone_statistics, type: json}
check_rules:
  - output_exists
